<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#07080c"
    >

    <meta
        name="description"
        content="SAPI AI — Built by Saprielle Studio."
    >

    <title>SAPI AI</title>

    <link

<body>

<div class="app-shell">

    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar" id="sidebar">

        <!-- BRAND -->

        <div class="brand">

            <div class="brand-logo">

                <!-- Existing SAPI SVG icon -->

                <svg
                    viewBox="0 0 48 48"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"

                    <path
                        d="M24 4L28.5 18.5L44 24L28.5 29.5L24 44L19.5 29.5L4 24L19.5 18.5L24 4Z"

                        stroke-width="2.4"

                    <circle

                        cy="24"
                        r="5"
                        fill="currentColor"
                    />
                </svg>

            </div>

            <div class="brand-text">

                <div class="brand-name">
                    SAPI
                </div>

                <div class="brand-ai">
                    AI
                </div>

            </div>

        </div>

        <button
            class="new-chat-btn"
            id="newChatBtn"
            type="button"

                    stroke-linecap="round"
                />

                <path
                    d="M5 12H19"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                />
            </svg>

            <span>
                New chat
            </span>

        </button>


        <!-- WORKSPACE -->

        <div class="sidebar-section">

            <div class="section-label">
                Workspace
            </div>


            <!-- Chats -->

            <button
                class="sidebar-item active"
                type="button"
            >

                <svg

                    <path
                        d="M19 12H22"

                        stroke-linecap="round"
                    />
                </svg>

                <span>
                    Agents

            <!-- Brainstorm -->

                type="button"

                        stroke-width="1.8"
                        stroke-linejoin="round"
                    />
                </svg>

                <span>
                    Brainstorm
                </span>

            </button>


            <!-- Code -->

            <button
                class="sidebar-item"
                type="button"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >
                    <path
                        d="M8.5 7L4 12L8.5 17"

                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                    <path
                        d="M15.5 7L20 12L15.5 17"
                        stroke="currentColor"

                        stroke-linecap="round"

                    <path
                        d="M13.5 4L10.5 20"

                        stroke-width="1.8"
                        stroke-linecap="round"

            <!-- Research -->

            <button
                class="sidebar-item"

                    />

                        stroke-linecap="round"
                    />
                </svg>

                <span>

            <!-- Study -->

            <button
                class="sidebar-item"
                type="button"
            >

                <svg
                    viewBox="0 0 24 24"

                    aria-hidden="true"
                >
                    <path
                        d="M4 6.5L12 3L20 6.5L12 10L4 6.5Z"
                        stroke="currentColor"

                        stroke-linejoin="round"
                    />

                    <path
                        d="M7 9V14C7 15.7 9.2 17 12 17C14.8 17 17 15.7 17 14V9"

                        stroke-width="1.8"
                    />

                    <path
                        d="M20 7V14"

        </div>


        <!-- SIDEBAR BOTTOM -->

        <div class="sidebar-bottom">

            <button
                class="sidebar-item settings-item"
                id="settingsBtn"

                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >
                    <path
                        d="M12 15.2C13.7673 15.2 15.2 13.7673 15.2 12C15.2 10.2327 13.7673 8.8 12 8.8C10.2327 8.8 8.8 10.2327 8.8 12C8.8 13.7673 10.2327 15.2 12 15.2Z"

                    Settings

    <!-- MOBILE OVERLAY -->

    <div
        id="mobileOverlay"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="main-area">

        <!-- TOP BAR -->

        <header class="topbar">

            <div class="topbar-left">

                <div class="selector-group">

                    <!-- MODEL -->

                    <div class="selector-box">

                        <select
                            id="modelSelect"
                            aria-label="AI model"
                        >

                            <option
                                value="sapi-plus"
                            >
                                SAPI+ — Coming soon
                            </option>

                            <option
                                value="sapi-5.5-plus"
                            >
                                SAPI 5.5+ — Coming soon
                            </option>

                            <option
                                value="google-gemini"
                                selected
                            >
                                Google Gemini
                            </option>

                            <option
                                value="openai"
                            >
                                OpenAI — Coming soon
                            </option>

                            <option
                                value="anthropic"
                            >
                                Anthropic — Coming soon
                            </option>

                        </select>

                    </div>


                    <!-- PERSONALITY -->

                    <div class="selector-box">

                        <select
                            id="personalitySelect"
                            aria-label="SAPI personality"
                        >

                            <option
                                value="standard"
                            >
                                Standard
                            </option>

                            <option
                                value="teacher"
                            >
                                Teacher
                            </option>

                            <option
                                value="programmer"
                            >
                                Programmer
                            </option>

                            <option
                                value="creative"
                            >
                                Creative
                            </option>

                            <option
                                value="study"
                            >
                                Study / Tutor
                            </option>

                            <option
                                value="researcher"
                            >
                                Researcher
                            </option>

                            <option
                                value="gamer"
                            >
                                Gamer
                            </option>

                            <option
                                value="analyst"
                            >
                                Analyst
                            </option>

                            <option
                                value="expert"
                            >
                                Expert
                            </option>

                            <option
                                value="friendly"
                            >
                                Friendly
                            </option>

                            <option
                                value="fast"
                            >
                                Fast
                            </option>

                            <option
                                value="calm"
                            >
                                Calm
                            </option>

                        </select>

                    </div>


                    <!-- MODE -->

                    <div class="selector-box">

                        <select
                            id="modeSelect"
                            aria-label="SAPI mode"
                        >

                            <option
                                value="chat"
                                selected
                            >
                                Chat
                            </option>

                            <option
                                value="research"
                            >
                                Research
                            </option>

                            <option
                                value="code"
                            >
                                Code
                            </option>

                            <option
                                value="study"
                            >
                                Study
                            </option>

                            <option
                                value="write"
                            >
                                Write
                            </option>

                            <option
                                value="math"
                            >
                                Math
                            </option>

                            <option
                                value="creative"
                            >
                                Creative
                            </option>

                            <option
                                value="analyze"
                            >
                                Analyze
                            </option>

                            <option
                                value="translate"
                            >
                                Translate
                            </option>

                            <option
                                value="summarize"
                            >
                                Summarize
                            </option>

                            <option
                                value="brainstorm"
                            >
                                Brainstorm
                            </option>

                            <option
                                value="plan"
                            >
                                Plan
                            </option>

                        </select>

                    </div>

                </div>

            </div>


            <!-- TOP RIGHT -->

            <div class="topbar-right topbar-actions">

                <button
                    class="shortcut-btn"
                    type="button"
                    title="Keyboard shortcuts"
                    aria-label="Keyboard shortcuts"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >
                        <rect
                            x="3"
                            y="5"
                            width="18"
                            height="14"
                            rx="3"
                            stroke="currentColor"
                            stroke-width="1.7"
                        />

                        <path
                            d="M7 9H7.01"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        />

                        <path
                            d="M11 9H11.01"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                        />

                        <path
                            d="M15 9H15.01"

                            stroke-width="2"
                            stroke-linecap="round"
                        />

                        <path
                            d="M7 13H17"
                            stroke="currentColor"
                            stroke-width="1.7"
                            stroke-linecap="round"
                        />
                    </svg>

                </button>


                <button
                    class="top-settings-btn"
                    id="topSettingsBtn"
                    type="button"
                    title="Settings"
                    aria-label="Settings"
                >

                        viewBox="0 0 24 24"

                        <path

                            stroke="currentColor"
                            stroke-width="1.7"
                            stroke-linejoin="round"
                        />
                    </svg>

                </button>


                <button
                    class="profile-button"
                    type="button"
                    aria-label="Profile"
                >
                    S
                </button>

            </div>

        </header>


        <!-- =================================================
             CHAT
             ================================================= -->

        <section
            class="chat-area"
            id="chatArea"
        >

            <!-- WELCOME -->

            <div
                class="welcome-screen"
                id="welcomeScreen"
            >

                <div class="sapi-avatar-wrap">

                    <div class="sapi-avatar">

                        <svg
                            viewBox="0 0 48 48"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >
                            <path
                                d="M24 5L28.2 18.8L43 24L28.2 29.2L24 43L19.8 29.2L5 24L19.8 18.8L24 5Z"
                                stroke="currentColor"
                                stroke-width="2.2"
                                stroke-linejoin="round"
                            />

                            <circle
                                cx="24"
                                cy="24"
                                r="4.5"
                                fill="currentColor"
                            />
                        </svg>

                    </div>

                </div>


                <h1>
                    How can SAPI help?
                </h1>

                <p>
                    SAPI AI is your intelligent workspace
                    for chat, research, coding, study,
                    writing, analysis and creative work.
                </p>


                <!-- QUICK ACTIONS -->

                <div class="quick-actions">

                    <!-- ASK -->

                    <button
                        class="quick-action"
                        type="button"
                        data-mode="ask"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >
                            <circle
                                cx="12"
                                cy="12"
                                r="8"
                                stroke="currentColor"
                                stroke-width="1.8"
                            />

                            <path
                                d="M9.8 9.2C10.1 8.2 10.9 7.6 12 7.6C13.3 7.6 14.2 8.4 14.2 9.5C14.2 10.8 13.2 11.3 12.5 11.8C11.9 12.2 11.6 12.7 11.6 13.5"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                            />

                            <circle
                                cx="11.6"
                                cy="16.2"
                                r="0.9"
                                fill="currentColor"
                            />
                        </svg>

                        <span class="quick-action-title">
                            Ask anything
                        </span>

                        <span class="quick-action-description">
                            Get a clear answer
                        </span>

                    </button>


                    <!-- CODE -->

                    <button
                        class="quick-action"
                        type="button"
                        data-mode="code"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >
                            <path
                                d="M8.5 7L4 12L8.5 17"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />

                            <path
                                d="M15.5 7L20 12L15.5 17"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />

                            <path
                                d="M13.5 4L10.5 20"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            />
                        </svg>

                        <span class="quick-action-title">
                            Code
                        </span>

                        <span class="quick-action-description">
                            Build and debug
                        </span>

                    </button>


                    <!-- RESEARCH -->

                    <button

                    >

                            fill="none"

                            aria-hidden="true"
                        >
                            <circle
                                cx="10.5"
                                cy="10.5"
                                r="5.5"
                                stroke="currentColor"
                                stroke-width="1.8"
                            />

                            <path
                                d="M15 15L20 20"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            />
                        </svg>

                        <span class="quick-action-title">
                            Research
                        </span>

                        <span class="quick-action-description">
                            Search and analyze
                        </span>

                    </button>


                    <!-- STUDY -->

                    <button
                        class="quick-action"
                        type="button"
                        data-mode="study"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >
                            <path
                                d="M4 6.5L12 3L20 6.5L12 10L4 6.5Z"

                                stroke-linecap="round"
                            />
                        </svg>

                        <span class="quick-action-title">
                            Study
                        </span>

                        <span class="quick-action-description">
                            Learn step by step
                        </span>

                    </button>


                    <!-- BRAINSTORM -->

                    <button
                        class="quick-action"
                        type="button"
                        data-mode="brainstorm"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >
                            <path
                                d="M9 18H15"
                                stroke="currentColor"

                            />

                            <path
                                d="M10 21H14"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            />

                            <path
                                d="M8.4 15.5C7.1 14.4 6 12.7 6 10.6C6 7.3 8.7 5 12 5C15.3 5 18 7.3 18 10.6C18 12.7 16.9 14.4 15.6 15.5C15 16 14.5 16.5 14.4 17H9.6C9.5 16.5 9 16 8.4 15.5Z"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linejoin="round"
                            />
                        </svg>

                        <span class="quick-action-title">
                            Brainstorm
                        </span>

                        <span class="quick-action-description">

                            aria-hidden="true"
                        >
                            <path
                                d="M5 19L8.2 18.3L18.3 8.2C19.2 7.3 19.2 5.8 18.3 4.9C17.4 4 15.9 4 15 4.9L4.9 15L4.2 18.2L5 19Z"

                                stroke-width="1.8"
                                stroke-linejoin="round"
                            />

                            <path
                                d="M13.8 6.1L17.9 10.2"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            />
                        </svg>

                        <span class="quick-action-title">
                            Write
                        </span>

                        <span class="quick-action-description">
                            Create and refine
                        </span>

                    </button>

                </div>

            </div>


            <!-- MESSAGES -->

            <div
                class="messages-container"
                id="messagesContainer"
            ></div>


            <!-- =================================================
                 COMPOSER
                 ================================================= -->

            <div class="composer-area">

                <div class="composer">

                    <!-- ATTACH -->

                    <button
                        id="attachBtn"
                        type="button"
                        title="Attach file"
                        aria-label="Attach file"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >
                            <path
                                d="M8.5 12.5L14.7 6.3C16.1 4.9 18.4 4.9 19.8 6.3C21.2 7.7 21.2 10 19.8 11.4L11.5 19.7C9.6 21.6 6.5 21.6 4.6 19.7C2.7 17.8 2.7 14.7 4.6 12.8L12.9 4.5"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />

                            <path
                                d="M8.5 12.5L14.1 6.9"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            />
                        </svg>

                    </button>


                    <!-- INPUT -->

                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Message SAPI..."
                        autocomplete="off"
                        spellcheck="true"
                    ></textarea>


                    <!-- VOICE -->

                    <button
                        id="voiceBtn"
                        type="button"
                        title="Voice input"
                        aria-label="Voice input"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >
                            <rect
                                x="8"
                                y="3"
                                width="8"
                                height="12"
                                rx="4"
                                stroke="currentColor"
                                stroke-width="1.8"
                            />

                            <path
                                d="M5 11C5 14.9 8.1 18 12 18C15.9 18 19 14.9 19 11"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            />

                            <path
                                d="M12 18V21"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            />

                            <path
                                d="M9 21H15"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            />
                        </svg>

                    </button>


                    <!-- SEND -->

                    <button
                        id="sendBtn"
                        type="button"
                        title="Send message"
                        aria-label="Send message"
                    >

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >
                            <path
                                d="M21 3L10.5 13.5"
                                stroke="currentColor"
                                stroke-width="1.9"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />

                            <path
                                d="M21 3L14.3 21L10.5 13.5L3 9.7L21 3Z"
                                stroke="currentColor"
                                stroke-width="1.9"
                                stroke-linejoin="round"
                            />
                        </svg>

                    </button>

                </div>


                <!-- Custom instructions are controlled by app.js -->

                <textarea
                    id="customInstructions"
                    aria-hidden="true"
                    tabindex="-1"
                ></textarea>

            </div>

        </section>

    </main>

</div>


<script
    src="app.js?v=3.0.0"
></script>

</body>
</html>
